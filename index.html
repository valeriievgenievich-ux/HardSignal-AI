<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardSignal AI Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg: #0a0514;
            --card-bg: rgba(25, 20, 40, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --green: #00ff88;
            --red: #ff3366;
            --purple: #8a2be2;
            --text: #e2e8f0;
            --muted: #8b8b9f;
        }

        body {
            background: radial-gradient(circle at top left, #1a0b2e 0%, #0a0514 50%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            overflow: hidden;
        }
        
        /* Шапка */
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(90deg, #fff, #a0aec0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Сетка карточек */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
            position: relative; overflow: hidden; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .card.active { 
            border-color: rgba(0, 255, 136, 0.4); 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
            background: rgba(20, 40, 30, 0.7);
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .card-icon { font-size: 14px; opacity: 0.7; }
        .card-value { font-size: 13px; font-weight: 600; color: #fff; }
        
        /* Мини-график в карточке */
        .mini-chart { height: 30px; width: 100%; margin-top: 5px; opacity: 0.5; }

        /* Центральная плашка */
        .center-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 20px; }
        
        .glass-card {
            width: 100%; max-width: 340px;
            background: linear-gradient(135deg, rgba(50, 30, 80, 0.8), rgba(20, 15, 30, 0.9));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px; padding: 20px;
            display: flex; align-items: center; gap: 15px;
            position: relative; z-index: 2;
            box-shadow: 0 10px 40px rgba(138, 43, 226, 0.2);
        }

        .logo-circle {
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.3) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; border: 1px solid rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            animation: pulseLogo 2s infinite alternate;
        }
        @keyframes pulseLogo { from { transform: scale(1); } to { transform: scale(1.05); } }

        .analyzing-text-block { display: flex; flex-direction: column; gap: 4px; z-index: 2; }
        .analyzing-title { font-size: 20px; font-weight: 800; color: #fff; display: flex; align-items: baseline; }
        .dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
        .analyzing-subtext { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }

        /* Прогресс-бар */
        .progress-container { width: 100%; margin-top: 15px; z-index: 2;}
        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: linear-gradient(90deg, var(--purple), var(--green)); transition: width 0.4s ease; }

        /* Кнопка Start */
        .start-btn-container { margin-top: auto; z-index: 10; }
        button {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #8a2be2, #00ff88);
            color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 1px;
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }
        button:active { transform: scale(0.98); }

        /* Экран результата */
        .result-box { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .result-header { text-align: center; margin-bottom: 15px; }
        .pair { font-size: 22px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
        .signal { font-size: 42px; font-weight: 900; margin: 0; }
        .signal.buy { color: var(--green); text-shadow: 0 0 30px rgba(0,255,136,0.4); }
        .signal.sell { color: var(--red); text-shadow: 0 0 30px rgba(255,51,102,0.4); }
        .exp { font-size: 14px; color: var(--muted); margin-top: 5px;}

        #chart-wrapper {
            flex-grow: 1; width: 100%; position: relative; 
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 10px; box-sizing: border-box; margin-bottom: 15px; min-height: 200px;
        }

        .trade-btn {
            display: block; width: 100%; padding: 18px; text-align: center;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000; font-size: 16px; font-weight: 800; text-transform: uppercase;
            text-decoration: none; border-radius: 12px; margin-bottom: 10px;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3); box-sizing: border-box;
            transition: 0.2s;
        }
        .trade-btn:active { transform: scale(0.98); }

        .btn-secondary {
            background: rgba(255,255,255,0.05); color: var(--text); padding: 15px; box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="analysis-screen" style="display: flex; flex-direction: column; height: 100%;">
        <div class="header"><div class="title">HardSignal AI</div></div>

        <div class="grid">
            <div class="card" id="card-trend">
                <div class="card-header"><span class="card-title">Trend - 5 sec</span><span class="card-icon">📈</span></div>
                <div class="card-value" id="val-trend">Waiting...</div>
            </div>
            <div class="card" id="card-resistance">
                <div class="card-header"><span class="card-title">Resistance</span><span class="card-icon">📊</span></div>
                <div class="card-value" id="val-resistance">Waiting...</div>
            </div>
            <div class="card" id="card-momentum">
                <div class="card-header"><span class="card-title">Momentum</span><span class="card-icon">⚡</span></div>
                <div class="card-value" id="val-momentum">Waiting...</div>
            </div>
            <div class="card" id="card-volume">
                <div class="card-header"><span class="card-title">Volume</span><span class="card-icon">🔊</span></div>
                <div class="card-value" id="val-volume">Waiting...</div>
            </div>
        </div>

        <div class="center-container">
            <div class="glass-card">
                <div class="logo-circle">🧠</div>
                <div class="analyzing-text-block">
                    <div class="analyzing-title"><span id="anim-title">Analyzing</span><span class="dots"></span></div>
                    <div class="analyzing-subtext"><span id="anim-subtext">Checking the hourly trend...</span></div>
                    <div class="progress-container">
                        <div class="progress-bar"><div class="progress" id="progress"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="start-btn-container">
            <button id="startBtn" onclick="startAnalysis()">START ANALYSIS</button>
        </div>
    </div>

    <div class="result-box" id="result-screen">
        <div class="result-header">
            <div class="pair" id="result-pair">EUR/USD OTC</div>
            <div class="signal" id="result-signal">BUY</div>
            <div class="exp" id="result-exp">Expiration: 3 min</div>
        </div>
        <div id="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
        
        <a href="https://u3.shortink.io/main?utm_campaign=832928&utm_source=affiliate&utm_medium=sr&a=qUgg03lCStQU7h&al=1815151&ac=main&cid=994565&code=WELCOME50" target="_blank" class="trade-btn" id="trade-link">
            TRADE ON POCKET OPTION
        </a>
        
        <button onclick="location.reload()" class="btn-secondary">Analyze Again</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const pairs = ["EUR/USD OTC", "GBP/USD OTC", "USD/JPY OTC", "AUD/CAD OTC", "NZD/USD OTC", "USD/CHF OTC", "EUR/GBP OTC", "USD/CAD OTC"];
        let myChartInstance = null;
        
        function startAnalysis() {
            document.getElementById('startBtn').style.display = 'none';
            
            const cards = ['card-trend', 'card-resistance', 'card-momentum', 'card-volume'];
            const vals = ['val-trend', 'val-resistance', 'val-momentum', 'val-volume'];
            const subtexts = ["Checking the hourly trend...", "Analyzing support levels...", "Measuring momentum...", "Processing volume data..."];
            const values = ["BULLISH", "SUPPORT", "STRONG", "HIGH"];

            let i = 0;
            const interval = setInterval(() => {
                if (i < cards.length) {
                    document.getElementById(cards[i]).classList.add('active');
                    document.getElementById(vals[i]).innerText = values[i];
                    document.getElementById('anim-subtext').innerText = subtexts[i];
                    document.getElementById('progress').style.width = ((i + 1) / cards.length) * 100 + '%';
                    i++;
                } else {
                    clearInterval(interval);
                    document.getElementById('anim-title').innerText = "Complete";
                    document.getElementById('anim-subtext').innerText = "Signal generated!";
                    setTimeout(showResult, 800);
                }
            }, 1500);
        }

        function showResult() {
            document.getElementById('analysis-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            
            const isBuy = Math.random() > 0.5;
            const randomPair = pairs[Math.floor(Math.random() * pairs.length)];
            const exp = [1, 3, 5][Math.floor(Math.random() * 3)];
            
            document.getElementById('result-pair').innerText = randomPair;
            document.getElementById('result-exp').innerText = `Expiration: ${exp} min`;
            const sigEl = document.getElementById('result-signal');
            sigEl.innerText = isBuy ? "BUY 📈" : "SELL 📉";
            sigEl.className = isBuy ? "signal buy" : "signal sell";

            const tradeBtn = document.getElementById('trade-link');
            if (isBuy) {
                tradeBtn.style.background = "linear-gradient(135deg, #00ff88, #00cc6a)";
                tradeBtn.innerText = "BUY NOW ON POCKET OPTION";
            } else {
                tradeBtn.style.background = "linear-gradient(135deg, #ff3366, #cc2952)";
                tradeBtn.style.color = "#fff";
                tradeBtn.innerText = "SELL NOW ON POCKET OPTION";
            }

            setTimeout(() => renderChart(isBuy), 100);
        }

        function renderChart(isBuy) {
            const ctx = document.getElementById('myChart').getContext('2d');
            const labels = [];
            const dataPoints = [];
            let currentPrice = 1.0850;

            for (let i = 0; i < 30; i++) {
                labels.push('');
                let trendBias = isBuy ? 0.0002 : -0.0002; 
                let change = (Math.random() - 0.5) * 0.001 + trendBias;
                currentPrice += change;
                dataPoints.push(currentPrice);
            }

            if (myChartInstance) { myChartInstance.destroy(); }

            const lineColor = isBuy ? '#00ff88' : '#ff3366';
            const bgColor = isBuy ? 'rgba(0, 255, 136, 0.1)' : 'rgba(255, 51, 102, 0.1)';

            myChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataPoints,
                        borderColor: lineColor,
                        backgroundColor: bgColor,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: true, position: 'right', grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b8b9f', font: { size: 10 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
