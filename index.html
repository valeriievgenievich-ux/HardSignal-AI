<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HardSignal AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        :root { --bg: #0a0514; --card-bg: rgba(25, 20, 40, 0.6); --border: rgba(255, 255, 255, 0.08); --green: #00ff88; --gold: #ffd700; --muted: #8b8b9f; --text: #fff; }
        * { box-sizing: border-box; }
        body { background: radial-gradient(circle at top, #1a0b2e 0%, #0a0514 60%); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 12px; display: flex; flex-direction: column; min-height: 100vh; overflow-y: auto; }
        
        .screen { display: none; flex-direction: column; align-items: center; flex-grow: 1; }
        .lock-icon { font-size: 50px; margin-bottom: 15px; }
        .lock-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .lock-sub { font-size: 13px; color: var(--muted); margin-bottom: 30px; text-align: center; }

        .step-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 12px; width: 100%; max-width: 320px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .step-card:active { transform: scale(0.98); }
        .step-card.done { border-color: var(--green); opacity: 0.6; pointer-events: none; }
        .step-info { text-align: left; }
        .step-name { font-size: 14px; font-weight: 800; }
        .step-desc { font-size: 10px; color: var(--muted); }
        .step-status { font-size: 20px; }

        .btn { width: 100%; max-width: 320px; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; font-size: 14px; font-weight: 900; cursor: pointer; margin-top: 20px; }
        .btn.disabled { background: #2a3441; color: var(--muted); cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Загрузка -->
    <div id="loading-screen" class="screen" style="display: flex; justify-content: center; align-items: center;">
        <h2>Checking access...</h2>
        <p id="debug-info" style="color: #8b8b9f; font-size: 12px; margin-top: 10px;">ID: unknown</p>
    </div>

    <!-- Экран блокировки -->
    <div id="lock-screen" class="screen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Access Locked</div>
        <div class="lock-sub" id="debug-status">Status: unknown</div> <!-- Сюда будем выводить статус -->

        <div class="step-card" id="step-1" onclick="openLink('https://t.me/hardsignal_ai')">
            <div class="step-info"><div class="step-name">1. Subscribe</div><div class="step-desc">Join our Telegram channel</div></div>
            <div class="step-status" id="status-1">⏳</div>
        </div>
        <div class="step-card" id="step-2" onclick="openLink('https://u3.shortink.io/register?utm_campaign=832928&utm_source=affiliate&utm_medium=sr&a=qUgg03lCStQU7h&al=1815124&ac=signal&cid=994543&code=WELCOME50')">
            <div class="step-info"><div class="step-name">2. Register</div><div class="step-desc">Create Pocket Option account</div></div>
            <div class="step-status" id="status-2">⏳</div>
        </div>
        <div class="step-card" id="step-3" onclick="openLink('https://u3.shortink.io/main?utm_campaign=832928&utm_source=affiliate&utm_medium=sr&a=qUgg03lCStQU7h&al=1815151&ac=main&cid=994565&code=WELCOME50')">
            <div class="step-info"><div class="step-name">3. Deposit</div><div class="step-desc">Make first deposit with promo code</div></div>
            <div class="step-status" id="status-3">⏳</div>
        </div>

        <button class="btn disabled">START ANALYSIS</button>
    </div>

    <!-- Основной экран -->
    <div id="app-screen" class="screen">
        <h2>✅ Access Granted</h2>
        <p style="color: var(--muted);">Your account is fully verified!</p>
        <div style="font-size: 50px; margin-top: 20px;">🧠</div>
        <button class="btn" style="margin-top: 30px;">START ANALYSIS</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : null;
        
        document.getElementById('debug-info').innerText = "ID: " + (userId || 'unknown');

        function openLink(url) {
            if (userId) url += `&click_id=${userId}`;
            Telegram.WebApp.openLink(url);
        }

        async function checkStatus() {
            if (!userId) {
                document.getElementById('debug-info').innerText = "Error: No Telegram ID";
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('lock-screen').style.display = 'flex';
                return;
            }

            try {
                const response = await fetch(`https://unframed-onlooker-harmonics.ngrok-free.dev/check?user_id=${userId}`);
                const data = await response.json();
                
                document.getElementById('debug-status').innerText = JSON.stringify(data);

                document.getElementById('loading-screen').style.display = 'none';

                if (data.subscribed && data.registered && data.deposited) {
                    document.getElementById('app-screen').style.display = 'flex';
                } else {
                    document.getElementById('lock-screen').style.display = 'flex';
                    if (data.subscribed) { document.getElementById('status-1').innerText = '✅'; document.getElementById('step-1').classList.add('done'); }
                    if (data.registered) { document.getElementById('status-2').innerText = '✅'; document.getElementById('step-2').classList.add('done'); }
                    if (data.deposited) { document.getElementById('status-3').innerText = '✅'; document.getElementById('step-3').classList.add('done'); }
                }
            } catch (e) {
                document.getElementById('debug-status').innerText = "Fetch Error";
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('lock-screen').style.display = 'flex';
            }
        }

        checkStatus();
    </script>
</body>
</html>
