<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardSignal AI Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: #151a23;
            --green: #00ff88;
            --red: #ff3366;
            --text: #e2e8f0;
            --muted: #64748b;
        }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            overflow: hidden;
        }
        
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .title { font-size: 22px; font-weight: bold; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card {
            background: var(--card-bg); border: 1px solid #2a3441; border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; transition: 0.3s;
        }
        .card.active { border-color: var(--green); box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        .card.active::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--green); }
        .card-title { font-size: 11px; color: var(--muted); text-transform: uppercase; }
        .card-value { font-size: 14px; font-weight: bold; }

        /* --- ЦЕНТРАЛЬНАЯ ПЛАШКА --- */
        .center-container {
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; margin-bottom: 20px;
        }
        .glass-card {
            width: 100%; max-width: 320px;
            background: linear-gradient(135deg, rgba(30, 40, 50, 0.8), rgba(15, 20, 25, 0.9));
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 2px solid var(--green);
            border-radius: 16px; padding: 20px;
            display: flex; align-items: center; gap: 15px;
            position: relative; z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden;
        }
        .logo-circle {
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; border: 1px solid rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); animation: pulseLogo 2s infinite alternate;
        }
        @keyframes pulseLogo {
            from { box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
            to { box-shadow: 0 0 30px rgba(0, 255, 136, 0.6); }
        }
        .analyzing-text-block { display: flex; flex-direction: column; gap: 5px; z-index: 2; }
        .analyzing-title { font-size: 22px; font-weight: bold; color: #fff; display: flex; align-items: baseline; }
        .dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
        .analyzing-subtext { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; transition: 0.3s; }

        .wave {
            position: absolute; bottom: 0; left: 0; width: 200%; height: 30px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%2300ff88" fill-opacity="0.15" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,144C672,139,768,181,864,197.3C960,213,1056,203,1152,170.7C1248,139,1344,85,1392,58.7L1440,32L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: 50% 100%; background-repeat: repeat-x; animation: waveAnim 3s linear infinite; z-index: 1;
        }
        @keyframes waveAnim { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Статус */
        .status-container { background: var(--card-bg); border-radius: 12px; padding: 15px; text-align: center; margin-top: auto; z-index: 10;}
        .progress-bar { width: 100%; height: 6px; background: #2a3441; border-radius: 3px; overflow: hidden; margin-bottom: 15px; }
        .progress { width: 0%; height: 100%; background: var(--green); transition: width 0.5s ease; }
        
        button {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            background: var(--green); color: #000; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        
        /* Экран результата */
        .result-box { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .result-header { text-align: center; margin-bottom: 10px; }
        .pair { font-size: 24px; color: var(--text); font-weight: bold; }
        .signal { font-size: 36px; font-weight: 900; margin: 5px 0; }
        .signal.buy { color: var(--green); text-shadow: 0 0 20px rgba(0,255,136,0.3); }
        .signal.sell { color: var(--red); text-shadow: 0 0 20px rgba(255,51,102,0.3); }
        .exp { font-size: 14px; color: var(--muted); }

        #chart-wrapper {
            flex-grow: 1; width: 100%; position: relative; background: var(--card-bg);
            border-radius: 12px; padding: 10px; box-sizing: border-box; margin-bottom: 15px; min-height: 200px;
        }

        /* Кнопка Trade Now */
        .trade-btn {
            display: block; width: 100%; padding: 18px; text-align: center;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000; font-size: 18px; font-weight: 900; text-transform: uppercase;
            text-decoration: none; border-radius: 12px; margin-bottom: 10px;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4); box-sizing: border-box;
        }
        .trade-btn:active { transform: scale(0.98); }

        .btn-secondary {
            background: #2a3441; color: white; padding: 15px;
        }
    </style>
</head>
<body>

    <div id="analysis-screen" style="display: flex; flex-direction: column; height: 100%;">
        <div class="header"><div class="title">HardSignal AI</div></div>

        <div class="grid">
            <div class="card" id="card-trend"><div class="card-title">Trend Analysis</div><div class="card-value" id="val-trend">Waiting...</div></div>
            <div class="card" id="card-resistance"><div class="card-title">Resistance</div><div class="card-value" id="val-resistance">Waiting...</div></div>
            <div class="card" id="card-momentum"><div class="card-title">Momentum</div><div class="card-value" id="val-momentum">Waiting...</div></div>
            <div class="card" id="card-volume"><div class="card-title">Volume</div><div class="card-value" id="val-volume">Waiting...</div></div>
        </div>

        <div class="center-container">
            <div class="glass-card">
                <div class="wave"></div>
                <div class="logo-circle">🧠</div>
                <div class="analyzing-text-block">
                    <div class="analyzing-title"><span id="anim-title">Analyzing</span><span class="dots"></span></div>
                    <div class="analyzing-subtext"><span id="anim-subtext">Checking the hourly trend...</span></div>
                </div>
            </div>
        </div>

        <div class="status-container">
            <div class="progress-bar"><div class="progress" id="progress"></div></div>
            <button id="startBtn" onclick="startAnalysis()">🚀 START ANALYSIS</button>
        </div>
    </div>

    <div class="result-box" id="result-screen">
        <div class="result-header">
            <div class="pair" id="result-pair">EUR/USD OTC</div>
            <div class="signal" id="result-signal">BUY</div>
            <div class="exp" id="result-exp">Expiration: 3 min</div>
        </div>
        <div id="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
        
        <!-- Кнопка для перехода в Pocket Option -->
        <a href="https://u3.shortink.io/main?utm_campaign=832928&utm_source=affiliate&utm_medium=sr&a=qUgg03lCStQU7h&al=1815151&ac=main&cid=994565&code=WELCOME50" target="_blank" class="trade-btn" id="trade-link">
            📈 Trade on Pocket Option
        </a>
        
        <button onclick="location.reload()" class="btn-secondary">🔄 Analyze Again</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const pairs = ["EUR/USD OTC", "GBP/USD OTC", "USD/JPY OTC", "AUD/CAD OTC", "NZD/USD OTC", "USD/CHF OTC", "EUR/GBP OTC", "USD/CAD OTC"];
        let myChartInstance = null;
        
        function startAnalysis() {
            document.getElementById('startBtn').style.display = 'none';
            
            const cards = ['card-trend', 'card-resistance', 'card-momentum', 'card-volume'];
            const vals = ['val-trend', 'val-resistance', 'val-momentum', 'val-volume'];
            const subtexts = ["Checking the hourly trend...", "Analyzing support levels...", "Measuring momentum...", "Processing volume data..."];
            const values = ["BULLISH", "SUPPORT", "STRONG", "HIGH"];

            let i = 0;
            const interval = setInterval(() => {
                if (i < cards.length) {
                    document.getElementById(cards[i]).classList.add('active');
                    document.getElementById(vals[i]).innerText = values[i];
                    document.getElementById(vals[i]).style.color = "var(--green)";
                    document.getElementById('anim-subtext').innerText = subtexts[i];
                    document.getElementById('progress').style.width = ((i + 1) / cards.length) * 100 + '%';
                    i++;
                } else {
                    clearInterval(interval);
                    document.getElementById('anim-title').innerText = "Complete";
                    document.getElementById('anim-subtext').innerText = "Signal generated!";
                    setTimeout(showResult, 800);
                }
            }, 1500);
        }

        function showResult() {
            document.getElementById('analysis-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            
            const isBuy = Math.random() > 0.5;
            const randomPair = pairs[Math.floor(Math.random() * pairs.length)];
            const exp = [1, 3, 5][Math.floor(Math.random() * 3)];
            
            document.getElementById('result-pair').innerText = randomPair;
            document.getElementById('result-exp').innerText = `Expiration: ${exp} min`;
            const sigEl = document.getElementById('result-signal');
            sigEl.innerText = isBuy ? "BUY 📈" : "SELL 📉";
            sigEl.className = isBuy ? "signal buy" : "signal sell";

            // Меняем текст на кнопке в зависимости от сигнала
            const tradeBtn = document.getElementById('trade-link');
            if (isBuy) {
                tradeBtn.innerText = "📈 BUY Now on Pocket Option";
                tradeBtn.style.background = "linear-gradient(135deg, #00ff88, #00cc6a)";
            } else {
                tradeBtn.innerText = "📉 SELL Now on Pocket Option";
                tradeBtn.style.background = "linear-gradient(135deg, #ff3366, #cc2952)";
                tradeBtn.style.color = "#fff";
                tradeBtn.style.boxShadow = "0 5px 20px rgba(255, 51, 102, 0.4)";
            }

            setTimeout(() => renderChart(isBuy), 100);
        }

        function renderChart(isBuy) {
            const ctx = document.getElementById('myChart').getContext('2d');
            const labels = [];
            const dataPoints = [];
            let currentPrice = 1.0850;

            for (let i = 0; i < 30; i++) {
                labels.push('');
                let trendBias = isBuy ? 0.0002 : -0.0002; 
                let change = (Math.random() - 0.5) * 0.001 + trendBias;
                currentPrice += change;
                dataPoints.push(currentPrice);
            }

            if (myChartInstance) { myChartInstance.destroy(); }

            const lineColor = isBuy ? '#00ff88' : '#ff3366';
            const bgColor = isBuy ? 'rgba(0, 255, 136, 0.1)' : 'rgba(255, 51, 102, 0.1)';

            myChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataPoints,
                        borderColor: lineColor,
                        backgroundColor: bgColor,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: true, position: 'right', grid: { color: '#2a3441' }, ticks: { color: '#64748b', font: { size: 10 } }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
