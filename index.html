<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Signal</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0e1117;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .status {
            font-size: 18px;
            margin-bottom: 20px;
            color: #9ca3af;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #1f2329;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            width: 0%;
            height: 100%;
            background-color: #00c853;
            transition: width 0.3s;
        }
        .result {
            font-size: 32px;
            font-weight: bold;
            display: none;
        }
        .buy { color: #00c853; }
        .sell { color: #ff3d00; }
        button {
            background-color: #00c853;
            color: #0e1117;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status" id="status">Ready to analyze</div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="result" id="result"></div>
        <button id="startBtn" onclick="startAnalysis()">Start Analysis</button>
    </div>

    <script>
        // Сообщаем Telegram, что приложение готово
        Telegram.WebApp.ready();

        function startAnalysis() {
            const status = document.getElementById('status');
            const progress = document.getElementById('progress');
            const result = document.getElementById('result');
            const btn = document.getElementById('startBtn');

            btn.style.display = 'none';
            result.style.display = 'none';
            progress.style.width = '0%';

            const steps = [
                "Analyzing trend...",
                "Checking resistance...",
                "Analyzing momentum...",
                "Generating signal..."
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < steps.length) {
                    status.innerText = steps[i];
                    progress.style.width = ((i + 1) / steps.length) * 100 + '%';
                    i++;
                } else {
                    clearInterval(interval);
                    status.innerText = "Analysis complete!";
                    
                    // Рандомно выбираем BUY или SELL
                    const isBuy = Math.random() > 0.5;
                    result.innerText = isBuy ? "BUY 📈" : "SELL 📉";
                    result.className = isBuy ? "result buy" : "result sell";
                    result.style.display = "block";

                    // Отправляем данные обратно в бота (чтобы он знал результат)
                    Telegram.WebApp.sendData(JSON.stringify({ signal: isBuy ? "BUY" : "SELL" }));
                }
            }, 1000); // Каждую секунду меняем статус
        }
    </script>
</body>
</html>
