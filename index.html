<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardSignal AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0a0514; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .step { background: #151a23; border: 1px solid #333; padding: 15px; margin: 10px; border-radius: 10px; width: 100%; max-width: 300px; display: flex; justify-content: space-between; }
        .done { border-color: #00ff88; }
        .btn { background: #ffd700; color: black; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; width: 100%; max-width: 300px; margin-top: 20px; cursor: pointer; }
        .btn.disabled { background: #333; color: #666; }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loading-screen" class="screen" style="display: flex;">
        <h2>Checking access...</h2>
        <p id="user-id-display">ID: unknown</p>
    </div>

    <!-- Экран блокировки -->
    <div id="lock-screen" class="screen">
        <h2>🔒 Access Locked</h2>
        <div class="step" id="step-1">
            <span>1. Subscribe</span>
            <span id="status-1">⏳</span>
        </div>
        <div class="step" id="step-2">
            <span>2. Register</span>
            <span id="status-2">⏳</span>
        </div>
        <div class="step" id="step-3">
            <span>3. Deposit</span>
            <span id="status-3">⏳</span>
        </div>
        <button class="btn disabled">START ANALYSIS</button>
    </div>

    <!-- Основной экран -->
    <div id="app-screen" class="screen">
        <h2>✅ Access Granted</h2>
        <p>Welcome to HardSignal AI Terminal!</p>
        <button class="btn">START ANALYSIS</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : null;
        
        document.getElementById('user-id-display').innerText = "ID: " + userId;

        async function checkStatus() {
            if (!userId) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('lock-screen').style.display = 'flex';
                return;
            }

            try {
                const response = await fetch(`https://unframed-onlooker-harmonics.ngrok-free.dev/check?user_id=${userId}`);
                const data = await response.json();

                document.getElementById('loading-screen').style.display = 'none';

                if (data.subscribed && data.registered && data.deposited) {
                    document.getElementById('app-screen').style.display = 'flex';
                } else {
                    document.getElementById('lock-screen').style.display = 'flex';
                    if (data.subscribed) { document.getElementById('status-1').innerText = '✅'; document.getElementById('step-1').classList.add('done'); }
                    if (data.registered) { document.getElementById('status-2').innerText = '✅'; document.getElementById('step-2').classList.add('done'); }
                    if (data.deposited) { document.getElementById('status-3').innerText = '✅'; document.getElementById('step-3').classList.add('done'); }
                }
            } catch (e) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('lock-screen').style.display = 'flex';
                console.error("Fetch error:", e);
            }
        }

        checkStatus();
    </script>
</body>
</html>
